<!DOCTYPE html>
<html lang="en">
<head>
    <script type="module" src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
    <script type="module" src="/app.js"></script>
    <link rel="stylesheet" href="style.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QSV Simulator Visualizer</title>
</head>
<body style="margin: 0%;">
    <div class="main">
        <div class="top-panel">
            <div class="dragables-menu menu">
                <div class="spacer">
                    
                </div>
                <div class="hadamard container">
                    <div class="hadamard gate" style="background-color: palegoldenrod; display:flex; justify-content: center; align-items: center;">
                        <h1>H</h1>
                    </div>
                </div>
                <div class="spacer">
                    
                </div>
                <div class="pauli-x container">
                    <div class="pauli-x gate" style="background-color: palevioletred; display:flex; justify-content: center; align-items: center;">
                        <h1>X</h1>
                    </div>
                </div>
                <div class="spacer">
                    
                </div>
                <div class="cnot container">
                    <div class="cnot gate" style="background-color: palegreen; display:flex; justify-content: center; align-items: center;">
                        <h3>CNOT</h3>
                    </div>
                </div>
                <div class="spacer">
                    
                </div>
            </div>
            <div class="qubit-view-menu menu">
                <svg class="qubit-container" preserveAspectRatio="xMidYMid meet">

                </svg>
            </div>
            <div class="output-menu menu">
                <div class="output-text-container">
                    <h1>OUTPUT</h1>
                    <p class="output-text">try measuring!</p>      
                                
                </div>
                <div class="histogram-container">
                        
                </div>  
            </div>
        </div>
        <div class="bottom-panel">
            <div class="timeline-menu menu">
                <h1>TIMELINE</h1>
                <div class="timeline-container">
                    <div class="timeline">

                    </div>
                </div>
            </div>
            <div class="actions-menu menu">
                <div class="measure-buttons-container">
                    <button class="measure-1x-button button">MEASURE 1X</button>
                    <button class="measure-10x-button button">MEASURE 10X</button>
                    <button class="measure-1000x-button button">MEASURE 1000X</button>
                </div>
                <button class="add-qubit-button button">+ QUBIT</button>
                <button class="sub-qubit-button button">- QUBIT</button>
                <button class="ground-qubits-button button">GROUND QUBITS (RESET)</button>
                
            </div>
        </div>
    </div>
</body>
</html>
